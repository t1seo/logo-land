<h1>Morrow Studio · 실제 이미지 도구 검수</h1><p>가상 브랜드를 이용한 플러그인 테스트입니다. 사용자 브랜드의 승인 시안이 아닙니다. 원본 PNG를 CSS 크기로만 표시하며 이미지 픽셀을 수정하지 않습니다.</p>
<section><figure><img src="images/a-v1.png" width="330" class="checker"><figcaption>A-v1 · 기하학 M / 원본<br>불투명 요청과 달리 투명 영역이 존재하여 전달 보류.</figcaption></figure><figure><img src="images/b-v1.png" width="330" class="checker"><figcaption>B-v1 · 유기적 잎 / 원본<br>별도 시안, 개별 파일과 프롬프트 보존.</figcaption></figure><figure><img src="images/a-v2.png" width="330"><figcaption>A-v2 · A를 참조한 실제 수정<br>남색과 불투명 배경. 미세한 곡률과 색조 변화는 래스터 생성의 한계.</figcaption></figure></section>
<h2>크기별 확인</h2><p>조합형 전체 로고는 48px에서 글자가 읽히기 어려우므로 작은 파비콘에는 별도 심볼형이 필요합니다.</p><div class="small"><img src="images/a-v2.png" width="48"><img src="images/a-v2.png" width="96"><img src="images/a-v2.png" width="256"></div>
