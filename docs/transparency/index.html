  <style>
    * { box-sizing: border-box; }

    nav { display: flex; flex-wrap: wrap; gap: 24px; margin: 24px 0; }
    .note { padding: 20px; border-left: 3px solid #a64b32; }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } body { padding: 24px 16px; } .surface { min-height: 220px; } }
  </style>
</head>
<body>
<main>
